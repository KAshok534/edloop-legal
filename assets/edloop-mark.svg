<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="markV2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <!-- Outer Arc: R=70, from 100,30 around to 45,130 -->
  <path d="M 100,30 A 70,70 0 1,1 45,130" fill="none" stroke="url(#markV2Grad)" stroke-width="14" stroke-linecap="round" />

  <!-- Inner Arc: R=48, adjusted with clean 16px parallel clearance channel -->
  <path d="M 68,136 A 48,48 0 0,0 148,100 A 48,48 0 0,0 100,52" fill="none" stroke="url(#markV2Grad)" stroke-width="11" stroke-linecap="round" opacity="0.9" />

  <!-- Focal Arrival Node at Apex -->
  <circle cx="100" cy="30" r="9" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
  <circle cx="100" cy="30" r="4.5" fill="#38bdf8" />

</svg>